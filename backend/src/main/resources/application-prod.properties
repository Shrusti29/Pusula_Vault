spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:${PG_HOST:localhost}}:${PGPORT:${PG_PORT:5432}}/${PGDATABASE:${PG_DB:pusula_km}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:${PG_USER:pusula}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:${PG_PWD:}}}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
server.forward-headers-strategy=native
logging.level.com.pusula.km=INFO
pv.cors.allowed-origins=${PV_CORS:http://localhost:8080}
