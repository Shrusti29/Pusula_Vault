services:
  - type: web
    name: pusula-vault
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: PGHOST
        fromDatabase:
          name: pusula-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: pusula-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: pusula-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: pusula-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: pusula-db
          property: password

databases:
  - name: pusula-db
    plan: free
